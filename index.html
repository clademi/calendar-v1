<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班日曆</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream:     #faf7f2;
  --cream2:    #f2ede4;
  --white:     #ffffff;
  --border:    #ddd5c8;
  --border2:   #c8bcac;
  --ink:       #2c2418;
  --ink2:      #6b5d4e;
  --ink3:      #a8977e;
  --terra:     #c4623a;
  --terra-bg:  #fdf1ec;
  --terra-bd:  #f0c4b0;
  --sage:      #5a7a5e;
  --sage-bg:   #edf5ee;
  --sage-bd:   #b8d4bb;
  --sat-c:     #5a6ea8;
  --sun-c:     #c4623a;
  --r:         10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cream); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; font-size: 14px; min-height: 100vh; }

/* ── Pages ── */
.page { display: none; height: 100vh; overflow: hidden; }
.page.active { display: flex; }
#calPage { flex-direction: row; }
#settingsPage { flex-direction: column; background: var(--cream); }

/* ── Sidebar ── */
.sidebar {
  width: 216px; flex-shrink: 0;
  background: var(--white); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 10;
}
.logo {
  padding: 22px 20px 18px; border-bottom: 1px solid var(--border);
  font-family: 'Lora', serif; font-size: 17px; font-weight: 700;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px; background: var(--terra);
  display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
}
.sb-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
.sb-section { padding: 16px 16px 8px; }
.sb-label { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink3); font-family: 'DM Mono', monospace; }

/* Stats */
.stats-wrap { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 4px; }
.stat-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--cream); border: 1px solid var(--border); border-radius: 8px; }
.stat-label { font-size: 12px; color: var(--ink2); }
.stat-value { font-size: 18px; font-weight: 700; font-family: 'DM Mono', monospace; }

/* Drag tags */
.tags-wrap { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 4px; }
.no-tags { font-size: 12px; color: var(--ink3); padding: 4px 4px; }

.drag-tag {
  display: flex; align-items: center; padding: 9px 12px;
  border-radius: 8px; border: 1.5px solid;
  font-size: 12.5px; font-weight: 600;
  cursor: grab; user-select: none;
  transition: box-shadow .15s, transform .12s, opacity .15s;
}
.drag-tag:hover { box-shadow: 0 3px 12px rgba(0,0,0,.1); }
.drag-tag:active { cursor: grabbing; transform: scale(.97); }
.drag-tag.dragging { opacity: .35; }
.drag-tag.rest { background: var(--sage-bg); border-color: var(--sage-bd); color: var(--sage); }
.drag-tag.course { background: var(--terra-bg); border-color: var(--terra-bd); color: var(--terra); }
.tag-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag-hint { font-size: 9.5px; opacity: .5; margin-left: 6px; font-family: 'DM Mono', monospace; flex-shrink: 0; }

/* Settings button */
.sb-bottom { padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
.settings-btn {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: none; color: var(--ink2); font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all .15s;
}
.settings-btn:hover { border-color: var(--terra); color: var(--terra); background: var(--terra-bg); }

/* ── Main ── */
.cal-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.cal-header {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.mob-toggle { display: none; }
.nav-btn {
  background: var(--cream); border: 1px solid var(--border); color: var(--ink2);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all .13s; flex-shrink: 0;
}
.nav-btn:hover { border-color: var(--ink); color: var(--ink); }
.month-display { font-family: 'Lora', serif; font-size: 22px; font-weight: 700; min-width: 175px; }
.month-yr { font-size: 13px; color: var(--ink3); font-family: 'DM Mono', monospace; margin-right: 6px; font-weight: 400; }
.today-btn {
  background: none; border: 1px solid var(--border); color: var(--ink2);
  padding: 6px 14px; border-radius: 8px; cursor: pointer;
  font-size: 12px; font-family: 'Noto Sans TC', sans-serif; transition: all .13s;
}
.today-btn:hover { border-color: var(--terra); color: var(--terra); }
.header-right { margin-left: auto; }

/* Sync button */
.sync-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 18px; border-radius: 8px; border: none;
  background: var(--terra); color: #fff;
  font-size: 13px; font-family: 'Noto Sans TC', sans-serif; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
.sync-btn:hover { opacity: .87; }
.sync-btn:disabled { opacity: .5; cursor: not-allowed; }
.sync-indicator {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,.5); flex-shrink: 0;
  transition: background .3s;
}
.sync-indicator.has-changes { background: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Loading overlay */
.loading-overlay {
  position: absolute; inset: 0;
  background: rgba(250,247,242,.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; font-size: 14px; color: var(--ink2);
  gap: 10px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border2);
  border-top-color: var(--terra);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.cal-main { position: relative; }

/* Calendar */
.cal-wrap { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }
.weekdays {
  display: grid; grid-template-columns: repeat(7,1fr); gap: 5px;
  position: sticky; top: 0; background: var(--cream); z-index: 5;
  padding: 6px 0 5px; margin-bottom: 2px;
}
.wd { text-align: center; font-size: 10px; letter-spacing: .12em; color: var(--ink3); font-family: 'DM Mono', monospace; text-transform: uppercase; padding: 4px 0; }
.wd.sat { color: var(--sat-c); } .wd.sun { color: var(--sun-c); }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }

.day-cell {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: var(--r); min-height: 108px; padding: 8px 7px 6px;
  transition: border-color .13s, box-shadow .13s, background .13s;
}
.day-cell.other-month { background: var(--cream2); opacity: .45; pointer-events: none; }
.day-cell.today { border-color: var(--terra); box-shadow: 0 0 0 3px rgba(196,98,58,.1); }
.day-cell.today .day-num { color: var(--terra); font-weight: 700; }
.day-cell.saturday .day-num { color: var(--sat-c); }
.day-cell.sunday .day-num { color: var(--sun-c); }
.day-cell.drop-rest { border-color: var(--sage)!important; box-shadow: 0 0 0 3px rgba(90,122,94,.14)!important; background: rgba(90,122,94,.04)!important; }
.day-cell.drop-course { border-color: var(--terra)!important; box-shadow: 0 0 0 3px rgba(196,98,58,.12)!important; background: rgba(196,98,58,.03)!important; }

.day-num { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--ink3); margin-bottom: 5px; line-height: 1; }
.day-events { display: flex; flex-direction: column; gap: 3px; }

.ev-course {
  display: flex; align-items: center; padding: 4px 7px; border-radius: 6px;
  background: var(--terra-bg); border: 1px solid var(--terra-bd); color: var(--terra);
  font-size: 11px; font-weight: 600; position: relative;
}
.ev-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 16px; }
.ev-del {
  display: none; position: absolute; top: 3px; right: 4px;
  border: none; background: rgba(196,98,58,.15); color: var(--terra);
  font-size: 9px; cursor: pointer; border-radius: 3px; padding: 1px 4px; line-height: 14px;
}
.ev-course:hover .ev-del { display: block; }

.ev-rest {
  display: flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 6px;
  background: var(--sage-bg); border: 1px solid var(--sage-bd); color: var(--sage);
  font-size: 11px; font-weight: 600; position: relative;
}
.ev-rest-del {
  display: none; position: absolute; top: 3px; right: 4px;
  border: none; background: rgba(90,122,94,.15); color: var(--sage);
  font-size: 9px; cursor: pointer; border-radius: 3px; padding: 1px 4px; line-height: 14px;
}
.ev-rest:hover .ev-rest-del { display: block; }

/* ── Settings page ── */
.settings-header {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 16px 32px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
.back-btn {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: none; color: var(--ink2);
  padding: 7px 14px; border-radius: 8px; font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all .13s;
}
.back-btn:hover { border-color: var(--ink); color: var(--ink); }
.settings-title { font-family: 'Lora', serif; font-size: 20px; font-weight: 700; }
.settings-body { flex: 1; overflow-y: auto; padding: 32px; max-width: 520px; }
.settings-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(44,36,24,.07); }
.settings-card-title { font-family: 'Lora', serif; font-size: 15px; font-weight: 700; margin-bottom: 18px; }
.add-row { display: flex; gap: 8px; margin-bottom: 16px; }
.add-input {
  flex: 1; background: var(--cream); border: 1.5px solid var(--border); border-radius: 8px;
  padding: 9px 14px; color: var(--ink); font-size: 13px; font-family: 'Noto Sans TC', sans-serif;
  outline: none; transition: border-color .15s;
}
.add-input:focus { border-color: var(--terra); }
.add-btn {
  background: var(--terra); border: none; color: #fff;
  padding: 9px 18px; border-radius: 8px; font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif; font-weight: 600; cursor: pointer; transition: opacity .13s;
}
.add-btn:hover { opacity: .85; }
.tag-item-list { display: flex; flex-direction: column; gap: 6px; }
.tag-item {
  display: flex; align-items: center; padding: 10px 12px;
  background: var(--terra-bg); border: 1px solid var(--terra-bd);
  border-radius: 8px; color: var(--terra); font-size: 13px; font-weight: 600;
}
.tag-item-name { flex: 1; }
.tag-item-del {
  border: none; background: rgba(196,98,58,.15); color: var(--terra);
  font-size: 12px; cursor: pointer; border-radius: 5px; padding: 4px 10px; transition: background .13s;
}
.tag-item-del:hover { background: rgba(196,98,58,.3); }
.no-tags-msg { font-size: 13px; color: var(--ink3); padding: 4px 0; }
.settings-status { margin-top: 14px; font-size: 12px; color: var(--ink3); font-family: 'DM Mono', monospace; min-height: 18px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--ink); color: #fff; border-radius: 20px; padding: 9px 22px; font-size: 12.5px;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 1000; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Mobile ── */
@media (max-width: 640px) {
  #calPage { flex-direction: column; }
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100vh;
    transform: translateX(-100%); transition: transform .28s ease; z-index: 100;
  }
  .sidebar.mob-open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.15); }
  .mob-overlay { display: none; position: fixed; inset: 0; background: rgba(44,36,24,.35); z-index: 99; }
  .mob-overlay.show { display: block; }
  .mob-toggle {
    display: flex; align-items: center; justify-content: center;
    background: var(--cream); border: 1px solid var(--border); color: var(--ink2);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .cal-header { padding: 12px 14px; gap: 8px; }
  .month-display { font-size: 18px; min-width: 0; }
  .today-btn { padding: 6px 10px; font-size: 11px; }
  .sync-btn { padding: 7px 12px; font-size: 11.5px; }
  .cal-wrap { padding: 10px 10px 24px; }
  .weekdays { gap: 3px; } .wd { font-size: 8.5px; letter-spacing: 0; }
  .cal-grid { gap: 3px; }
  .day-cell { min-height: 68px; padding: 5px 4px 4px; border-radius: 7px; }
  .day-num { font-size: 10px; margin-bottom: 3px; }
  .ev-course, .ev-rest { padding: 3px 5px; font-size: 9px; }
  .ev-del, .ev-rest-del { display: block; font-size: 8px; }
  .tag-hint { display: none; }
  .settings-body { padding: 20px 16px; }
}
::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<!-- ══ CALENDAR PAGE ══ -->
<div id="calPage" class="page active">
  <div class="mob-overlay" id="mobOverlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo"><div class="logo-mark">📅</div>排班日曆</div>
    <div class="sb-scroll">
      <div class="sb-section"><span class="sb-label">本月統計</span></div>
      <div class="stats-wrap">
        <div class="stat-row"><span class="stat-label">上課天數</span><span class="stat-value" id="statCourse">—</span></div>
        <div class="stat-row"><span class="stat-label">休假天數</span><span class="stat-value" id="statRest">—</span></div>
      </div>
      <div class="sb-section"><span class="sb-label">排休</span></div>
      <div class="tags-wrap">
        <div class="drag-tag rest" draggable="true"
          ondragstart="onDragStart(event,'rest','')"
          ondragend="onDragEnd(event)">
          <span class="tag-name">🌿 休假</span>
          <span class="tag-hint">拖入日期</span>
        </div>
      </div>
      <div class="sb-section"><span class="sb-label">課程</span></div>
      <div class="tags-wrap" id="courseTagList"><div class="no-tags">載入中…</div></div>
    </div>
    <div class="sb-bottom">
      <button class="settings-btn" onclick="goSettings()">⚙️ 設定</button>
    </div>
  </aside>

  <div class="cal-main" id="calMain">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div><span>載入中…</span>
    </div>
    <div class="cal-header">
      <button class="mob-toggle" onclick="openSidebar()">☰</button>
      <button class="nav-btn" id="prevBtn">‹</button>
      <div class="month-display" id="monthDisplay"></div>
      <button class="nav-btn" id="nextBtn">›</button>
      <button class="today-btn" onclick="goToday()">今天</button>
      <div class="header-right">
        <button class="sync-btn" id="syncBtn" onclick="syncToServer()">
          <span class="sync-indicator" id="syncIndicator"></span>同步儲存
        </button>
      </div>
    </div>
    <div class="cal-wrap">
      <div class="weekdays">
        <div class="wd">一</div><div class="wd">二</div><div class="wd">三</div>
        <div class="wd">四</div><div class="wd">五</div>
        <div class="wd sat">六</div><div class="wd sun">日</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</div>

<!-- ══ SETTINGS PAGE ══ -->
<div id="settingsPage" class="page">
  <div class="settings-header">
    <button class="back-btn" onclick="goCalendar()">← 返回</button>
    <div class="settings-title">設定</div>
  </div>
  <div class="settings-body">
    <div class="settings-card">
      <div class="settings-card-title">課程標籤管理</div>
      <div class="add-row">
        <input class="add-input" id="newTagInput" placeholder="輸入課程名稱" maxlength="30">
        <button class="add-btn" onclick="addCourseTag()">新增</button>
      </div>
      <div class="tag-item-list" id="tagItemList"></div>
      <div class="settings-status" id="settingsStatus"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzN_crkxdW_7R1wE6rgvFIMS7RHe-RM_dRpL2_7l3ZrTrEJZnMAg_W_3m2vZSa02fQe/exec';

// ── State ────────────────────────────────
let allCourses = [];   // all months from server
let allShifts  = [];   // all months from server
let courseTags = [];   // { name }
let courses    = [];   // current month working copy
let restDays   = [];   // current month working copy
let hasPending = false;
let dragType   = null;
let dragValue  = null;
let dataLoaded = false;

const today = new Date();
let cy = today.getFullYear();
let cm = today.getMonth();

// ── Boot — wait for data THEN render ─────
async function init() {
  showLoading(true);
  try {
    const d = await apiGet('getAll');
    allCourses = d.courses    || [];
    allShifts  = d.shifts     || [];
    courseTags = d.courseTags || [];
    dataLoaded = true;
  } catch (e) {
    showToast('⚠️ 無法連線，請重新整理');
    console.error(e);
  }
  showLoading(false);
  loadMonth();
  renderAll();
}

init();

// ── Loading overlay ───────────────────────
function showLoading(show) {
  document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
}

// ── Month helpers ─────────────────────────
function monthPrefix() {
  return `${cy}-${String(cm + 1).padStart(2, '0')}`;
}
function loadMonth() {
  const p = monthPrefix();
  courses  = allCourses.filter(c => c.date.startsWith(p)).map(c => ({ ...c }));
  restDays = allShifts.filter(s => s.date.startsWith(p)).map(s => ({ ...s }));
}
function saveMonth() {
  const p = monthPrefix();
  allCourses = allCourses.filter(c => !c.date.startsWith(p)).concat(courses);
  allShifts  = allShifts.filter(s => !s.date.startsWith(p)).concat(restDays);
}

// ── Navigation ────────────────────────────
document.getElementById('prevBtn').onclick = () => { saveMonth(); cm--; if(cm<0){cm=11;cy--;} loadMonth(); renderAll(); };
document.getElementById('nextBtn').onclick = () => { saveMonth(); cm++; if(cm>11){cm=0;cy++;} loadMonth(); renderAll(); };
function goToday() { saveMonth(); cy=today.getFullYear(); cm=today.getMonth(); loadMonth(); renderAll(); }

// ── Render ───────────────────────────────
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function renderAll() {
  // Header
  document.getElementById('monthDisplay').innerHTML =
    `<span class="month-yr">${cy}</span>${MONTHS[cm]}`;
  renderCourseTags();
  renderCal();
  renderStats();
}

function renderCourseTags() {
  const el = document.getElementById('courseTagList');
  if (!courseTags.length) {
    el.innerHTML = '<div class="no-tags">請至設定新增課程</div>';
    return;
  }
  el.innerHTML = courseTags.map(t => `
    <div class="drag-tag course" draggable="true"
      ondragstart="onDragStart(event,'course',${JSON.stringify(t.name)})"
      ondragend="onDragEnd(event)">
      <span class="tag-name">${esc(t.name)}</span>
      <span class="tag-hint">拖入日期</span>
    </div>`).join('');
}

function renderCal() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const first    = new Date(cy, cm, 1);
  const lastDay  = new Date(cy, cm+1, 0).getDate();
  const jsFirst  = first.getDay();
  const startOff = jsFirst === 0 ? 6 : jsFirst - 1;
  const total    = Math.ceil((startOff + lastDay) / 7) * 7;

  for (let i = 0; i < total; i++) {
    const d      = new Date(cy, cm, i - startOff + 1);
    const isThis = d.getMonth() === cm;
    const isTod  = d.toDateString() === today.toDateString();
    const ds     = fmtDate(d);
    const dow    = d.getDay();

    const cell = document.createElement('div');
    cell.className = 'day-cell'
      + (isThis  ? ''           : ' other-month')
      + (isTod   ? ' today'    : '')
      + (dow===6 ? ' saturday' : '')
      + (dow===0 ? ' sunday'   : '');

    const dayCourse = isThis ? courses.find(c => c.date === ds) : null;
    const hasRest   = isThis ? restDays.some(r => r.date === ds) : false;

    let evHtml = '';
    if (dayCourse) {
      evHtml += `
        <div class="ev-course">
          <div class="ev-name">${esc(dayCourse.course_name)}</div>
          <button class="ev-del" onclick="deleteCourse('${ds}',event)">✕</button>
        </div>`;
    }
    if (hasRest) {
      evHtml += `
        <div class="ev-rest">
          <span>🌿</span><span>休假</span>
          <button class="ev-rest-del" onclick="deleteRest('${ds}',event)">✕</button>
        </div>`;
    }

    cell.innerHTML = `<div class="day-num">${d.getDate()}</div><div class="day-events">${evHtml}</div>`;

    if (isThis) {
      cell.addEventListener('dragover', e => {
        e.preventDefault();
        cell.classList.remove('drop-rest','drop-course');
        if (dragType) cell.classList.add('drop-' + dragType);
      });
      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drop-rest','drop-course');
      });
      cell.addEventListener('drop', e => {
        e.preventDefault();
        cell.classList.remove('drop-rest','drop-course');
        handleDrop(ds);
      });
    }

    grid.appendChild(cell);
  }
}

function renderStats() {
  document.getElementById('statCourse').textContent =
    new Set(courses.map(c => c.date)).size;
  document.getElementById('statRest').textContent =
    restDays.length;
}

// ── Drag ─────────────────────────────────
function onDragStart(e, type, value) {
  dragType  = type;
  dragValue = value;
  e.dataTransfer.effectAllowed = 'copy';
  e.currentTarget.classList.add('dragging');
}
function onDragEnd(e) {
  dragType = dragValue = null;
  e.currentTarget.classList.remove('dragging');
}
function handleDrop(ds) {
  if (dragType === 'course') doAddCourse(ds, dragValue);
  else if (dragType === 'rest') doAddRest(ds);
}

// ── Local mutations ───────────────────────
function doAddCourse(ds, name) {
  const idx = courses.findIndex(c => c.date === ds);
  if (idx >= 0) courses[idx].course_name = name;
  else courses.push({ date: ds, course_name: name });
  setPending(true);
  renderCal(); renderStats();
  showToast(`${ds.slice(5)} 加入「${name}」`);
}
function doAddRest(ds) {
  if (restDays.some(r => r.date === ds)) { showToast('此日已標記休假'); return; }
  restDays.push({ date: ds });
  setPending(true);
  renderCal(); renderStats();
  showToast(`${ds.slice(5)} 已標記休假`);
}
function deleteCourse(ds, e) {
  e.stopPropagation();
  courses = courses.filter(c => c.date !== ds);
  setPending(true);
  renderCal(); renderStats();
  showToast('已移除課程');
}
function deleteRest(ds, e) {
  e.stopPropagation();
  restDays = restDays.filter(r => r.date !== ds);
  setPending(true);
  renderCal(); renderStats();
  showToast('已移除休假');
}
function setPending(v) {
  hasPending = v;
  document.getElementById('syncIndicator').classList.toggle('has-changes', v);
}

// ── Sync ─────────────────────────────────
async function syncToServer() {
  if (!hasPending) { showToast('沒有待同步的變更'); return; }
  saveMonth();
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  btn.textContent = '同步中…';
  try {
    const r = await apiPost({ action:'sync', courses: allCourses, shifts: allShifts });
    if (!r.ok) throw new Error(r.error || 'sync failed');
    setPending(false);
    showToast('✓ 已同步至 Google Sheets');
  } catch (e) {
    showToast('❌ 同步失敗，請重試');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="sync-indicator" id="syncIndicator"' + (hasPending?' class="has-changes"':'') + '></span>同步儲存';
  }
}

// ── Settings ─────────────────────────────
function goSettings() {
  renderSettingsPage();
  document.getElementById('calPage').classList.remove('active');
  document.getElementById('settingsPage').classList.add('active');
}
function goCalendar() {
  document.getElementById('settingsPage').classList.remove('active');
  document.getElementById('calPage').classList.add('active');
  renderCourseTags();
}
function renderSettingsPage() {
  const el = document.getElementById('tagItemList');
  if (!courseTags.length) {
    el.innerHTML = '<div class="no-tags-msg">尚無課程標籤</div>';
    return;
  }
  el.innerHTML = courseTags.map(t => `
    <div class="tag-item">
      <span class="tag-item-name">${esc(t.name)}</span>
      <button class="tag-item-del" onclick="deleteCourseTag(${JSON.stringify(t.name)})">刪除</button>
    </div>`).join('');
}

async function addCourseTag() {
  const input = document.getElementById('newTagInput');
  const name  = input.value.trim();
  if (!name) return;
  if (courseTags.find(t => t.name === name)) { showToast('此課程已存在'); return; }
  setSettingsStatus('儲存中…');
  try {
    const r = await apiPost({ action:'addCourseTag', name });
    if (!r.ok) throw new Error(r.error);
    courseTags.push({ name });
    input.value = '';
    renderSettingsPage();
    setSettingsStatus('✓ 已儲存');
    showToast(`✓ 新增「${name}」`);
  } catch (e) {
    setSettingsStatus('❌ 儲存失敗');
    showToast('❌ 新增失敗，請重試');
    console.error(e);
  }
}

async function deleteCourseTag(name) {
  const idx = courseTags.findIndex(t => t.name === name);
  if (idx < 0) return;
  setSettingsStatus('刪除中…');
  try {
    const r = await apiPost({ action:'deleteCourseTag', name });
    if (!r.ok) throw new Error(r.error);
    courseTags.splice(idx, 1);
    renderSettingsPage();
    setSettingsStatus('✓ 已刪除');
    showToast(`已刪除「${name}」`);
  } catch (e) {
    setSettingsStatus('❌ 刪除失敗');
    showToast('❌ 刪除失敗，請重試');
    console.error(e);
  }
}

function setSettingsStatus(msg) {
  document.getElementById('settingsStatus').textContent = msg;
}
document.getElementById('newTagInput').addEventListener('keydown', e => { if(e.key==='Enter') addCourseTag(); });

// ── Mobile ────────────────────────────────
function openSidebar() {
  document.getElementById('sidebar').classList.add('mob-open');
  document.getElementById('mobOverlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('mobOverlay').classList.remove('show');
}

// ── API ───────────────────────────────────
async function apiGet(action) {
  const r = await fetch(`${API}?action=${encodeURIComponent(action)}`);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'API error');
  return d;
}
async function apiPost(body) {
  const r = await fetch(API, { method:'POST', body: JSON.stringify(body) });
  const d = await r.json();
  return d;
}

// ── Utils ─────────────────────────────────
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
