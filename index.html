<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的行事曆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f4;
    --warm-white: #fdfbf9;
    --sand: #ede3d8;
    --sand-mid: #ddd0c0;
    --clay: #c8b49a;
    --accent: #b07a6e;
    --accent-deep: #8c5e54;
    --header-bg: #ede8e2;
    --header-border: #d4c8bc;
    --text-dark: #4a3f38;
    --text-mid: #8a7870;
    --text-light: #b8a89e;
    --leaf: #9ab89e;
    --leaf-bg: rgba(154,184,158,0.18);
    --rose: #c4998e;
    --rose-bg: rgba(196,153,142,0.15);
    --shadow: rgba(120, 90, 70, 0.08);
    --shadow-deep: rgba(120, 90, 70, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(200,180,154,0.13) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(154,184,158,0.10) 0%, transparent 50%);
  }

  /* ── Header ── */
  header {
    background: var(--header-bg);
    color: var(--text-dark);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 0 var(--header-border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--text-dark);
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    padding: 7px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    transition: all 0.18s;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--clay);
    color: var(--text-mid);
  }
  .btn-outline:hover { background: var(--sand); color: var(--text-dark); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-deep); transform: translateY(-1px); }

  /* ── Main Layout ── */
  main {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
  }

  /* ── Month Nav ── */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 24px;
  }

  .nav-arrow {
    background: none;
    border: 1px solid var(--sand-mid);
    color: var(--text-mid);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
    flex-shrink: 0;
  }
  .nav-arrow:hover {
    background: var(--sand);
    border-color: var(--clay);
    color: var(--text-dark);
  }

  .month-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .month-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.6rem;
    font-weight: 300;
    color: var(--text-dark);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .today-btn {
    font-size: 0.72rem;
    padding: 3px 12px;
    background: none;
    border: 1px solid var(--sand-mid);
    border-radius: 20px;
    color: var(--text-light);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .today-btn:hover { border-color: var(--clay); color: var(--text-mid); background: var(--sand); }

  /* ── Calendar Grid ── */
  .calendar-wrap {
    background: var(--warm-white);
    border-radius: 12px;
    box-shadow: 0 2px 16px var(--shadow);
    overflow: hidden;
    border: 1px solid var(--sand);
  }

  .weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--header-bg);
    border-bottom: 1px solid var(--sand-mid);
  }

  .weekday-header span {
    text-align: center;
    padding: 10px 0;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text-mid);
    letter-spacing: 0.1em;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-left: 1px solid var(--sand);
    border-top: 1px solid var(--sand);
  }

  .day-cell {
    min-height: 110px;
    border-right: 1px solid var(--sand);
    border-bottom: 1px solid var(--sand);
    padding: 8px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .day-cell:hover { background: rgba(200,180,154,0.10); }
  .day-cell.other-month { background: rgba(237,227,216,0.40); }
  .day-cell.other-month .day-num { color: var(--text-light); }

  .day-cell.today .day-num {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .day-num {
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--text-mid);
    line-height: 1;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif TC', serif;
  }

  /* Sunday colour */
  .day-cell:nth-child(7n) .day-num,
  .weekday-header span:last-child {
    color: var(--rose);
  }
  .day-cell:nth-child(7n) .day-num { font-weight: 400; }

  /* ── Tags ── */
  .tag {
    font-size: 0.72rem;
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
    max-width: 100%;
  }

  .tag-course {
    background: var(--leaf-bg);
    color: #5a7e5e;
    border-left: 2px solid var(--leaf);
  }
  
  /* 說明會：淺灰色系 */
  .tag-briefing {
    background: #f0f0f0; 
    color: #666666;
    border-left: 2px solid #cccccc;
  }
  
  /* 實戰：橘色系 */
  .tag-practice {
    background: #fff5eb;
    color: #d97706;
    border-left: 2px solid #f59e0b;
  }
  .tag-holiday {
    background: var(--rose-bg);
    color: var(--accent-deep);
    border-left: 2px solid var(--rose);
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: flex-end;
    margin: 14px 0 0;
    font-size: 0.78rem;
    color: var(--text-mid);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(74,63,56,0.35);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--warm-white);
    border-radius: 12px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 32px var(--shadow-deep);
    overflow: hidden;
    animation: slideUp 0.22s ease;
    border: 1px solid var(--sand);
  }

  @keyframes slideUp {
    from { transform: translateY(16px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--sand-mid);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--text-dark);
    letter-spacing: 0.06em;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
    transition: color 0.15s;
  }
  .modal-close:hover { color: var(--text-dark); }

  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .field-group { display: flex; flex-direction: column; gap: 6px; }

  .field-group label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-mid);
    letter-spacing: 0.04em;
  }

  .field-group select,
  .field-group input[type="time"] {
    padding: 9px 12px;
    border: 1.5px solid var(--sand);
    border-radius: 8px;
    background: #fff;
    color: var(--text-dark);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }
  .field-group select:focus,
  .field-group input[type="time"]:focus { border-color: var(--clay); }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .toggle-label {
    font-size: 0.9rem;
    color: var(--text-dark);
    font-weight: 500;
  }

  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--sand);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    left: 3px;
    top: 3px;
    transition: transform 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  .toggle input:checked + .toggle-slider { background: var(--terracotta); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

  .section-divider {
    border: none;
    border-top: 1.5px dashed var(--sand);
    margin: 4px 0;
  }

  /* existing entries in modal */
  .existing-entries { display: flex; flex-direction: column; gap: 6px; }

  .entry-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 0.82rem;
  }

  .entry-item.course-entry {
    background: var(--leaf-bg);
    color: #5a7e5e;
  }

  .entry-item.holiday-entry {
    background: var(--rose-bg);
    color: var(--accent-deep);
  }

  .entry-delete {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.5;
    transition: opacity 0.15s;
    color: inherit;
    line-height: 1;
  }
  .entry-delete:hover { opacity: 1; }

  .modal-footer {
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    border-top: 1px solid var(--sand);
    background: var(--header-bg);
  }

  .btn-save {
    background: var(--accent);
    color: #fff;
    padding: 9px 22px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    transition: all 0.18s;
  }
  .btn-save:hover { background: var(--accent-deep); }

  .btn-cancel {
    background: none;
    border: 1px solid var(--sand-mid);
    color: var(--text-light);
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.85rem;
    transition: all 0.18s;
  }
  .btn-cancel:hover { border-color: var(--clay); color: var(--text-mid); }

  /* ── Course Manager Modal ── */
  .course-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }

  .course-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--sand);
    border-radius: 6px;
    font-size: 0.85rem;
    color: var(--text-dark);
  }

  .add-course-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .add-course-row input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--sand-mid);
    border-radius: 6px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.85rem;
    color: var(--text-dark);
    background: #fff;
    outline: none;
  }
  .add-course-row input:focus { border-color: var(--clay); }

  .btn-add {
    background: var(--leaf);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: 'Noto Sans TC', sans-serif;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }
  .btn-add:hover { background: #7a9e7e; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--text-dark);
    color: var(--cream);
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 0.82rem;
    z-index: 999;
    transition: transform 0.3s ease, opacity 0.3s;
    opacity: 0;
    white-space: nowrap;
    box-shadow: 0 4px 16px var(--shadow-deep);
    letter-spacing: 0.04em;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── Loading overlay ── */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(250,247,244,0.75);
    z-index: 500;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--text-mid);
    letter-spacing: 0.06em;
  }
  .loading-overlay.show { display: flex; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--sand-mid);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Config banner ── */
  .config-banner {
    background: #fdf5ec;
    border: 1px solid var(--sand-mid);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.82rem;
    color: var(--text-mid);
    line-height: 1.8;
    letter-spacing: 0.03em;
  }
  .config-banner strong { color: var(--accent); }
  .config-banner code {
    background: var(--sand);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 0.8rem;
  }

  /* ── Responsive 修正版 ── */
@media (max-width: 680px) {
  header { padding: 14px 16px; }
  header h1 { font-size: 1.1rem; }
  
  main { margin: 12px auto; padding: 0 8px; }
  
  .month-title { font-size: 1.3rem; min-width: 140px; }
  
  /* 增加手機版格子的高度，確保放得下標籤 */
  .day-cell { 
    min-height: 85px; /* 從 68px 增加到 85px */
    padding: 4px 2px; 
    gap: 2px;
  }
  
  .day-num { 
    font-size: 0.75rem; 
    width: 20px; 
    height: 20px; 
    margin-bottom: 2px;
  }
  
  /* 縮小手機版標籤字體與邊距，讓它不會塞不下 */
  .tag { 
    font-size: 0.62rem; 
    padding: 1px 3px; 
    letter-spacing: -0.02em; /* 稍微縮小字距 */
    border-radius: 2px;
  }
  
  .weekday-header span { font-size: 0.65rem; padding: 6px 0; }
  
  /* 傳說 (Legend) 部分也微調一下 */
  .legend { gap: 10px; font-size: 0.7rem; margin-top: 10px; }
  
  /* 彈出視窗在手機上改為滿版，比較好操作 */
  .modal { max-width: 95%; margin: 10px; }
}

</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingText">同步中...</span>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Header -->
<header>
  <h1>📅 我的行事曆</h1>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="openCourseManager()">課程管理</button>
    <button class="btn btn-primary" onclick="syncFromSheets()">⟳ 同步</button>
  </div>
</header>

<!-- Main -->
<main>
  <!-- Config Banner (shown until SCRIPT_URL is set) -->
  <div class="config-banner" id="configBanner">
    ⚙️ <strong>首次設定：</strong>請在下方 JS 中將 <code>SCRIPT_URL</code> 替換為你的 Google Apps Script 網址，才能啟用資料同步功能。<br>
    詳細步驟請參考附上的 <strong>部署說明.txt</strong>。
  </div>

  <!-- Month Nav -->
  <div class="month-nav">
    <button class="nav-arrow" onclick="changeMonth(-1)" title="上個月">‹</button>
    <div class="month-center">
      <div class="month-title" id="monthTitle"></div>
      <button class="today-btn" onclick="goToday()">回到今天</button>
    </div>
    <button class="nav-arrow" onclick="changeMonth(1)" title="下個月">›</button>
  </div>

  <!-- Calendar -->
  <div class="calendar-wrap">
    <div class="weekday-header">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--leaf-bg);border-left:2px solid var(--leaf);"></div>
      <span>課程</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--rose-bg);border-left:2px solid var(--rose);"></div>
      <span>休假</span>
    </div>
  </div>
</main>

<!-- ── Day Modal ── -->
<div class="modal-backdrop" id="dayModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalDateTitle">選擇日期</h2>
      <button class="modal-close" onclick="closeDayModal()">×</button>
    </div>
    <div class="modal-body">
      <!-- Existing entries -->
      <div id="existingEntries" class="existing-entries"></div>
      <hr class="section-divider" id="entriesDivider" style="display:none">

      <!-- Holiday toggle -->
      <div class="toggle-row">
        <span class="toggle-label">🌿 標記為休假</span>
        <label class="toggle">
          <input type="checkbox" id="holidayToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <hr class="section-divider">

      <!-- Add course -->
      <div class="field-group">
        <label>＋ 新增課程</label>
        <select id="courseSelect">
          <option value="">— 選擇課程 —</option>
        </select>
      </div>
      <div class="field-group">
        <label>課程時間</label>
        <input type="time" id="courseTime" value="19:30" step="900">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDayModal()">取消</button>
      <button class="btn-save" onclick="saveDay()">儲存</button>
    </div>
  </div>
</div>

<!-- ── Course Manager Modal ── -->
<div class="modal-backdrop" id="courseModal">
  <div class="modal">
    <div class="modal-header">
      <h2>課程管理</h2>
      <button class="modal-close" onclick="closeCourseModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="course-list" id="courseList"></div>
      <div class="add-course-row">
        <input type="text" id="newCourseName" placeholder="輸入新課程名稱" maxlength="30"
               onkeydown="if(event.key==='Enter') addCourse()">
        <button class="btn-add" onclick="addCourse()">新增</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeCourseModal()">關閉</button>
      <button class="btn-save" onclick="saveCourses()">儲存課程清單</button>
    </div>
  </div>
</div>

<script>
/* 請將上方 HTML 的 <script> 區塊內容更新為以下程式碼 */

// ══════════════════════════════════════════
//  ⚙️  設定區 — 填入你的 Apps Script 網址
// ══════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySBhEu8pZa80LNdgh7t2KgKkmK7dYF4xBjXeHpxiJZdJQ564dLYwStZ4FCIJthqDfc/exec';
// ══════════════════════════════════════════

// ── State ──
let currentYear, currentMonth;
let calendarData  = {};   
let courseList    = [];   
let editingDate   = null;
let isConfigured  = SCRIPT_URL !== 'YOUR_APPS_SCRIPT_URL_HERE';

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  if (isConfigured) {
    document.getElementById('configBanner').style.display = 'none';
    loadAll();
  } else {
    loadLocal();
    renderCalendar();
  }
});

function loadLocal() {
  try {
    calendarData = JSON.parse(localStorage.getItem('calendarData') || '{}');
    courseList   = JSON.parse(localStorage.getItem('courseList')   || '[]');
  } catch(e) {}
}

function saveLocal() {
  localStorage.setItem('calendarData', JSON.stringify(calendarData));
  localStorage.setItem('courseList',   JSON.stringify(courseList));
}

function apiGet(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = '_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = new URL(SCRIPT_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('callback', cbName);
    for (const [k,v] of Object.entries(params)) url.searchParams.set(k, v);

    const script = document.createElement('script');
    const timer  = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 10000);
    window[cbName] = (data) => { cleanup(); resolve(data); };

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    script.onerror = () => { cleanup(); reject(new Error('script error')); };
    script.src = url.toString();
    document.head.appendChild(script);
  });
}

function apiFetch(action, payload = {}) {
  // 透過 JSONP 模擬 POST 寫入
  return apiGet(action, { payload: JSON.stringify(payload) });
}

async function loadAll() {
  showLoading('載入資料中...');
  try {
    const [cal, courses] = await Promise.all([
      apiGet('getCalendar'),
      apiGet('getCourses')
    ]);
    calendarData = cal || {};
    courseList   = courses || [];
    saveLocal();
  } catch(e) {
    loadLocal();
    showToast('⚠️ 無法連線，使用本機快取');
  } finally {
    hideLoading();
    renderCalendar();
  }
}

async function syncFromSheets() {
  if (!isConfigured) { showToast('請先設定 SCRIPT_URL'); return; }
  await loadAll();
  showToast('✓ 同步完成');
}

function renderCalendar() {
  const titles = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('monthTitle').textContent = `${currentYear} 年 ${titles[currentMonth]}`;
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  const today = new Date();
  const firstDay = new Date(currentYear, currentMonth, 1);
  let startDow = firstDay.getDay(); 
  startDow = startDow === 0 ? 6 : startDow - 1; 

  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const prevDays = new Date(currentYear, currentMonth, 0).getDate();
  const totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    let day, year, month, otherMonth = false;
    if (i < startDow) {
      day = prevDays - startDow + i + 1;
      month = currentMonth - 1;
      year = currentYear;
      if (month < 0) { month = 11; year--; }
      otherMonth = true;
    } else if (i >= startDow + daysInMonth) {
      day = i - startDow - daysInMonth + 1;
      month = currentMonth + 1;
      year = currentYear;
      if (month > 11) { month = 0; year++; }
      otherMonth = true;
    } else {
      day = i - startDow + 1;
      month = currentMonth;
      year = currentYear;
    }

    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = (year === today.getFullYear() && month === today.getMonth() && day === today.getDate());

    if (otherMonth) cell.classList.add('other-month');
    if (isToday) cell.classList.add('today');
    cell.onclick = () => openDayModal(dateStr);

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = day;
    cell.appendChild(numEl);

    const entry = calendarData[dateStr];
    if (entry) {
      if (entry.holiday) {
        const t = document.createElement('div');
        t.className = 'tag tag-holiday';
        t.textContent = '🌿 休假';
        cell.appendChild(t);
      }
      if (entry.courses) {
        entry.courses.forEach(c => {
          const t = document.createElement('div');
          
          // --- 顏色判斷邏輯開始 ---
          let typeClass = 'tag-course'; // 預設綠色
          if (c.name.includes('說明會')) {
            typeClass = 'tag-briefing';
          } else if (c.name.includes('實戰')) {
            typeClass = 'tag-practice';
          }
          // --- 顏色判斷邏輯結束 ---

          t.className = `tag ${typeClass}`;
          t.textContent = `${c.time ? c.time+' ' : ''}${c.name}`;
          cell.appendChild(t);
        });
      }
    }
    grid.appendChild(cell);
  }
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0;  currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderCalendar();
}

function goToday() {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  renderCalendar();
}

function openDayModal(dateStr) {
  editingDate = dateStr;
  const [y, m, d] = dateStr.split('-');
  const weekdays = ['日','一','二','三','四','五','六'];
  const dow = new Date(+y, +m-1, +d).getDay();
  document.getElementById('modalDateTitle').textContent = `${y}/${+m}/${+d} (${weekdays[dow]})`;

  const entry = calendarData[dateStr] || { holiday: false, courses: [] };
  document.getElementById('holidayToggle').checked = !!entry.holiday;
  renderExistingEntries(entry);

  const sel = document.getElementById('courseSelect');
  sel.innerHTML = '<option value="">— 選擇課程 —</option>';
  courseList.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c; sel.appendChild(opt);
  });
  document.getElementById('courseTime').value = '19:30';
  document.getElementById('dayModal').classList.add('open');
}

function renderExistingEntries(entry) {
  const container = document.getElementById('existingEntries');
  const divider = document.getElementById('entriesDivider');
  container.innerHTML = '';
  const hasEntries = (entry.holiday || (entry.courses && entry.courses.length));
  divider.style.display = hasEntries ? 'block' : 'none';

  if (entry.holiday) {
    const el = document.createElement('div');
    el.className = 'entry-item holiday-entry';
    el.innerHTML = `<span>🌿 休假</span><button class="entry-delete" onclick="removeHoliday()">✕</button>`;
    container.appendChild(el);
  }
  if (entry.courses) {
    entry.courses.forEach((c, idx) => {
      const el = document.createElement('div');
      el.className = 'entry-item course-entry';
      el.innerHTML = `<span>${c.time ? c.time+' ' : ''}${c.name}</span><button class="entry-delete" onclick="removeCourse(${idx})">✕</button>`;
      container.appendChild(el);
    });
  }
}

function removeHoliday() {
  document.getElementById('holidayToggle').checked = false;
  if (calendarData[editingDate]) calendarData[editingDate].holiday = false;
  renderExistingEntries(calendarData[editingDate]);
}

function removeCourse(idx) {
  if (calendarData[editingDate] && calendarData[editingDate].courses) {
    calendarData[editingDate].courses.splice(idx, 1);
  }
  renderExistingEntries(calendarData[editingDate]);
}

function closeDayModal() {
  document.getElementById('dayModal').classList.remove('open');
  renderCalendar();
}

async function saveDay() {
  const holiday = document.getElementById('holidayToggle').checked;
  const courseSel = document.getElementById('courseSelect').value;
  const courseTime = document.getElementById('courseTime').value;

  if (!calendarData[editingDate]) calendarData[editingDate] = { holiday: false, courses: [] };
  const entry = calendarData[editingDate];
  entry.holiday = holiday;
  if (courseSel) entry.courses.push({ name: courseSel, time: courseTime });

  saveLocal();
  closeDayModal();

  if (isConfigured) {
    showLoading('儲存中...');
    try {
      await apiFetch('setDay', { date: editingDate, data: entry });
      showToast('✓ 已儲存至雲端');
    } catch(e) { showToast('⚠️ 同步失敗，已存於本機'); }
    finally { hideLoading(); }
  }
}

function openCourseManager() { renderCourseList(); document.getElementById('courseModal').classList.add('open'); }
function closeCourseModal() { document.getElementById('courseModal').classList.remove('open'); }
function renderCourseList() {
  const list = document.getElementById('courseList');
  list.innerHTML = '';
  courseList.forEach((c, idx) => {
    const item = document.createElement('div');
    item.className = 'course-list-item';
    item.innerHTML = `<span>${c}</span><button class="entry-delete" onclick="deleteCourseItem(${idx})">✕</button>`;
    list.appendChild(item);
  });
}
function deleteCourseItem(idx) { courseList.splice(idx, 1); renderCourseList(); }
function addCourse() {
  const input = document.getElementById('newCourseName');
  const name = input.value.trim();
  if (!name || courseList.includes(name)) return;
  courseList.push(name);
  input.value = ''; renderCourseList();
}
async function saveCourses() {
  saveLocal(); closeCourseModal();
  if (isConfigured) {
    showLoading('儲存課程清單...');
    try {
      await apiFetch('setCourses', { courses: courseList });
      showToast('✓ 課程清單更新成功');
    } catch(e) { showToast('⚠️ 儲存失敗'); }
    finally { hideLoading(); }
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }
</script>
